name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  # Called by release.yml on a tag push, so a release gates on the SAME suite a
  # PR runs. Re-declaring these jobs in the release file would guarantee the two
  # drift, and the drift would only show up as a bad release.
  workflow_call:

concurrency:
  # A LITERAL `ci`, not ${{ github.workflow }}. That context aliases to the
  # CALLER's workflow name when a workflow is reached through `workflow_call`,
  # which makes a called run share its caller's group and deadlock:
  #   "Canceling since a deadlock was detected for concurrency group ..."
  # Pinning this half to a constant keeps that impossible if this file is ever
  # called from a release pipeline.
  group: ci-${{ github.ref }}
  # PR iterations only — cancelling on push/schedule would let one run kill
  # another, and a cancelled run reports neither success nor failure.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: rust (fmt + clippy + goldens)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # crates/openapi path-deps opensdk/crates/oas_doc, so without the
          # submodule cargo cannot load the workspace at all.
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Keyed on the COMMITTED Cargo.lock, not on a Cargo.toml glob: hashing the
      # manifests alone misses exactly the transitive bumps that can flip a
      # byte-compared golden.
      - uses: Swatinem/rust-cache@v2
        with:
          key: apitoolchain-${{ hashFiles('Cargo.lock') }}

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      # The converters' fixture-parity tiers: 68 tests comparing generated output
      # against committed oracles. XYD_BLESS must NEVER be set here — it
      # regenerates the goldens instead of checking them.
      - run: cargo test --workspace

      - name: the api CLI builds
        run: cargo build -p api --bin api

      - name: standalone guard (this repo must not reach back into xyd)
        run: bash scripts/check-standalone.sh

  node:
    name: node (shims, both modes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - run: pnpm install --frozen-lockfile

      # The shims import each other through dist/, which is gitignored.
      - run: pnpm build

      # The shim suites. @xyd-js/native ships real platform binaries as of 0.1.0,
      # so these now exercise the NATIVE path here — the inverse of what this job
      # asserted before that release.
      - run: pnpm test:unit

      - name: the native binding is what actually ran
        # Non-vacuity, asserted rather than assumed — and the assertion is now the
        # OPPOSITE of what it used to be.
        #
        # Before @xyd-js/native@0.1.0 there were no platform binaries on npm, so
        # this job pinned the fact that the frozen JS implementation was what ran
        # and required XYD_REQUIRE_NATIVE=1 to FAIL. A real .node now resolves from
        # the registry, so the same command must PASS. Keeping the old polarity
        # would have failed CI the moment the binaries shipped; deleting the check
        # instead would have left the job proving nothing.
        #
        # This matters most once the frozen implementations are gone: with nothing
        # to silently degrade to, a broken addon has to be loud here.
        run: |
          if ! XYD_REQUIRE_NATIVE=1 node -e "import('./packages/apitoolchain-gql/dist/index.js')"; then
            echo "::error::@xyd-js/native did not load. With the frozen JS implementations reaped there is nothing to fall back to."
            exit 1
          fi
          # Resolve from a SHIM directory, not from the repo root. @xyd-js/native
          # is declared only in the shims' optionalDependencies, and pnpm's
          # isolated node_modules means the root cannot see it — a bare
          # `require('@xyd-js/native')` here dies with MODULE_NOT_FOUND, which
          # looks exactly like the missing-addon failure this step exists to
          # report, while actually being a bug in the step.
          node -e "
            const path = require.resolve('@xyd-js/native', {
              paths: ['packages/apitoolchain-uniform'],
            });
            const n = require(path);
            const need = ['gqlSchemaToReferences','oapSchemaToReferencesFromFile','mcpToReferences','pluginNavigation'];
            const missing = need.filter(k => typeof n[k] !== 'function');
            if (missing.length) {
              console.error('::error::addon loaded but is missing: ' + missing.join(', '));
              process.exit(1);
            }
            console.log('confirmed: native binding loaded with ' + Object.keys(n).length + ' exports');
          "
