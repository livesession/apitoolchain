name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  # Called by release.yml on a tag push, so a release gates on the SAME suite a
  # PR runs. Re-declaring these jobs in the release file would guarantee the two
  # drift, and the drift would only show up as a bad release.
  workflow_call:

concurrency:
  # A LITERAL `ci`, not ${{ github.workflow }}. That context aliases to the
  # CALLER's workflow name when a workflow is reached through `workflow_call`,
  # which makes a called run share its caller's group and deadlock:
  #   "Canceling since a deadlock was detected for concurrency group ..."
  # Pinning this half to a constant keeps that impossible if this file is ever
  # called from a release pipeline.
  group: ci-${{ github.ref }}
  # PR iterations only — cancelling on push/schedule would let one run kill
  # another, and a cancelled run reports neither success nor failure.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: rust (fmt + clippy + goldens)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # crates/xyd_openapi path-deps opensdk/crates/oas_doc, so without the
          # submodule cargo cannot load the workspace at all.
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Keyed on the COMMITTED Cargo.lock, not on a Cargo.toml glob: hashing the
      # manifests alone misses exactly the transitive bumps that can flip a
      # byte-compared golden.
      - uses: Swatinem/rust-cache@v2
        with:
          key: apitoolchain-${{ hashFiles('Cargo.lock') }}

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      # The converters' fixture-parity tiers: 68 tests comparing generated output
      # against committed oracles. XYD_BLESS must NEVER be set here — it
      # regenerates the goldens instead of checking them.
      - run: cargo test --workspace

      - name: the api CLI builds
        run: cargo build -p api --bin api

      - name: standalone guard (this repo must not reach back into xyd)
        run: bash scripts/check-standalone.sh

  node:
    name: node (shims, both modes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - run: pnpm install --frozen-lockfile

      # The shims import each other through dist/, which is gitignored.
      - run: pnpm build

      # 115 tests across the five shims. @xyd-js/native is an OPTIONAL dependency
      # and is not published with platform binaries, so every shim resolves to its
      # frozen JS implementation here. That is deliberate and it is a SUBSET: the
      # native ⇄ JS parity gate runs in xyd's CI, which builds the addon (it
      # compiles these very crates) and runs these same packages through the
      # submodule in both modes with XYD_REQUIRE_NATIVE=1.
      - run: pnpm test:unit

      - name: the JS fallback is what actually ran
        # Non-vacuity, asserted rather than assumed. If @xyd-js/native ever DID
        # load here, the step above would be exercising the native path while
        # this job's name claims it gates the fallback.
        #
        # XYD_REQUIRE_NATIVE=1 turns a failed addon load into a hard throw (the
        # same flag xyd's dual-mode gate sets on its =1 leg). Here it must FAIL:
        # a pass would mean a working addon appeared. Note the published
        # @xyd-js/native IS installed — it is a stub that throws "Cannot find
        # native binding" on require — so checking that the package resolves
        # would prove nothing; what matters is that no binding loads.
        run: |
          if XYD_REQUIRE_NATIVE=1 node -e "import('./packages/xyd-gql/dist/index.js')" 2>/dev/null; then
            echo "::error::@xyd-js/native loaded — this job claims to gate the JS fallback but exercised the native path."
            exit 1
          fi
          echo "confirmed: no native binding loads here; the frozen JS implementation is what ran"
