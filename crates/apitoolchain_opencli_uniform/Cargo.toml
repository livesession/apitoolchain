[package]
name = "apitoolchain_opencli_uniform"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
description = "OpenCLI document -> Uniform Reference[] (Rust port of @xyd-js/opencli's opencliToReferences)"

# Page-compile hot path: the docs engine calls this for every CLI reference page
# (`api.cli` → Atlas). Ported from packages/opencli/src/converters.ts, gated
# by that package's frozen `__fixtures__/references/**` goldens.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
apitoolchain_uniform = { path = "../apitoolchain_uniform" }

[dev-dependencies]
# The fixtures are validated against the base OpenCLI schema and the vendored
# extensions schema (tests/schema.rs). No HTTP or file resolving: both schemas
# are self-contained.
jsonschema = { version = "0.61", default-features = false }
# Pins the vendored extensions schema to the hash its source record states.
sha2 = "0.10"
