[package]
name = "xyd_openapi"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

# W2 of the S6+ Rust migration: OpenAPI 3.x → Uniform Reference[] — the Rust
# port of packages/xyd-openapi's conversion pipeline. Endpoint code-sample
# generation (@readme/oas-to-snippet) intentionally stays a JS post-pass in the
# shim; component-schema JSON examples ARE generated here. The frozen fixtures
# are the spec (tier-1 compares with endpoint examples stripped; tier-2 through
# the shim covers the combined output).

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
# The spec loader/dereferencer moved to the `opensdk` submodule, which owns the
# SDK/CLI toolchain that shares it. Being outside this workspace directory, it
# builds as an ordinary dependency but is NOT covered by `cargo fmt --all` /
# `cargo clippy --workspace` here; opensdk's CI lints it. A missing checkout
# fails at manifest-load with the path in the message — see scripts/ensure-submodules.mjs.
# A GIT dep pinned by rev, not a path into a nested submodule.
#
# Both this repo and xyd need oas_doc, and xyd builds its napi addon over
# BOTH trees at once. With two path-deps cargo refuses outright — "package
# collision in the lockfile: oas_doc v0.0.0 (.../apitoolchain/opensdk/...) and
# oas_doc v0.0.0 (.../opensdk/...) are different, but only one can be written
# unambiguously" — because path-deps are identified by PATH, even when the two
# trees are byte-identical (they were: same submodule, same pin).
#
# A git source is ONE package identity everywhere, so xyd resolves it to its
# own checkout with a [patch] in packages/xyd-native/Cargo.toml. It also makes
# this repo self-contained: no nested submodule to initialize or keep in sync.
oas_doc = { git = "https://github.com/livesession/opensdk", rev = "3917b4cecc447eae3a3eb71622d0af6764b30267" }
xyd_uniform = { path = "../xyd_uniform" }

[dev-dependencies]
xyd_parity = { path = "../xyd_parity" }
